[project]
name = "ecommerce-financial-analytics"
version = "0.1.0"
description = "Local financial analytics pipeline for a Shopify + Meta Ads e-commerce brand."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "config", "tests"]


[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["streamlit.*", "plotly.*"]
ignore_missing_imports = true


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"